<input
  type="file"
  class="file-input"
  (change)="onFileSelected($event)"
  #fileUpload
/>

<div class="file-upload">
  <mat-form-field>
    <input matInput disabled="true" [value]="fileName()" />
  </mat-form-field>

  <button
    mat-mini-fab
    color="primary"
    class="upload-btn"
    (click)="fileUpload.click(); onTouched()"
    [disabled]="disabled()"
  >
    <mat-icon>attach_file</mat-icon>
  </button>
</div>

@if (uploadProgress() > 0) {
<mat-progress-bar
  class="progress-bar"
  mode="determinate"
  [value]="uploadProgress()"
></mat-progress-bar>
}
